<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb4bb"/>
      <stop offset="0.45" stop-color="#e8ebef"/>
      <stop offset="1" stop-color="#878d95"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d434d"/>
      <stop offset="1" stop-color="#14181e"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#9aa2ac"/>
    </linearGradient>
  </defs>
  <!-- grip -->
  <line x1="100" y1="8" x2="95" y2="34" stroke="#2b2f36" stroke-width="9" stroke-linecap="round"/>
  <!-- shaft -->
  <line x1="95" y1="30" x2="72" y2="132" stroke="url(#shaft)" stroke-width="5" stroke-linecap="round"/>
  <!-- hosel -->
  <line x1="72" y1="130" x2="70" y2="143" stroke="#4a515b" stroke-width="8" stroke-linecap="round"/>
  <!-- head: big pear-shaped driver body -->
  <path d="M 70 143
           C 78 150, 79 160, 73 168
           C 65 180, 42 190, 28 186
           C 16 183, 10 173, 13 162
           C 16 151, 27 144, 41 142
           C 52 140, 63 140, 70 143 Z" fill="url(#crown)"/>
  <!-- deep face: bright crescent on the leading edge -->
  <path d="M 20 148
           C 14 154, 12 166, 16 175
           C 18 180, 23 184, 28 186
           C 22 175, 21 158, 27 145
           C 24 145, 22 146, 20 148 Z" fill="url(#face)"/>
  <!-- crown highlight along top line -->
  <path d="M 41 142 C 53 140, 65 140, 70 143" stroke="#5c646f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
