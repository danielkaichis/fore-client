<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb4bb"/>
      <stop offset="0.45" stop-color="#e8ebef"/>
      <stop offset="1" stop-color="#878d95"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd2d8"/>
      <stop offset="1" stop-color="#8d949d"/>
    </linearGradient>
  </defs>
  <!-- grip -->
  <line x1="94" y1="8" x2="89" y2="34" stroke="#2b2f36" stroke-width="8" stroke-linecap="round"/>
  <!-- shaft -->
  <line x1="89" y1="30" x2="79" y2="136" stroke="url(#shaft)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- hosel -->
  <line x1="79" y1="134" x2="77" y2="148" stroke="#4a515b" stroke-width="7" stroke-linecap="round"/>
  <!-- head: wedge with rounded, bouncy sole -->
  <path d="M 77 146
           C 62 148, 42 154, 28 162
           C 21 166, 18 174, 21 183
           C 23 190, 29 194, 37 194
           L 64 195
           C 72 195, 78 190, 79 181
           Z" fill="url(#blade)"/>
  <!-- face edge -->
  <path d="M 23 164 C 20 170, 20 177, 21 184" stroke="#f2f4f6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- grooves -->
  <line x1="29" y1="168" x2="43" y2="164" stroke="#6d747d" stroke-width="1.2"/>
  <line x1="30" y1="174" x2="46" y2="170" stroke="#6d747d" stroke-width="1.2"/>
  <line x1="31" y1="180" x2="48" y2="176" stroke="#6d747d" stroke-width="1.2"/>
  <!-- thick rounded sole (bounce) -->
  <path d="M 22 188 C 32 194, 58 196, 76 193" stroke="#575e67" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
