<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb4bb"/>
      <stop offset="0.45" stop-color="#e8ebef"/>
      <stop offset="1" stop-color="#878d95"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc7"/>
      <stop offset="0.55" stop-color="#8d949d"/>
      <stop offset="1" stop-color="#565d66"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#a7aeb7"/>
    </linearGradient>
  </defs>
  <!-- grip -->
  <line x1="96" y1="8" x2="91" y2="34" stroke="#2b2f36" stroke-width="9" stroke-linecap="round"/>
  <!-- shaft -->
  <line x1="91" y1="30" x2="79" y2="132" stroke="url(#shaft)" stroke-width="5" stroke-linecap="round"/>
  <!-- hosel -->
  <line x1="79" y1="130" x2="77" y2="142" stroke="#4a515b" stroke-width="8" stroke-linecap="round"/>
  <!-- head: compact steel hybrid body -->
  <path d="M 77 142
           C 84 147, 85 155, 80 161
           C 73 169, 55 173, 44 170
           C 34 167, 30 160, 33 153
           C 36 146, 45 142, 56 141
           C 64 140, 72 140, 77 142 Z" fill="url(#body)"/>
  <!-- flat iron-style face: bright crescent on the leading edge -->
  <path d="M 37 150
           C 32 153, 31 159, 33 164
           C 35 168, 39 170, 44 170
           C 40 163, 40 154, 44 146
           C 41 146, 39 147, 37 150 Z" fill="url(#face)"/>
  <!-- dark crown cap (wood-like top) -->
  <path d="M 56 141 C 64 140, 72 140, 77 142 C 81 145, 82 149, 81 152 C 76 146, 66 143, 56 143 Z" fill="#22272e"/>
  <!-- sole line -->
  <path d="M 44 170 C 56 173, 70 170, 79 163" stroke="#3d434b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
